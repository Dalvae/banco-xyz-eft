# en los tests no hay config-server, eureka, mysql ni kafka
spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.datasource.url=jdbc:h2:mem:pagos-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.sql.init.mode=always
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks
spring.security.oauth2.client.registration.ms-pagos.client-id=ms-pagos
spring.security.oauth2.client.registration.ms-pagos.client-secret=test
spring.security.oauth2.client.registration.ms-pagos.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.ms-pagos.scope=cuentas:operar
spring.security.oauth2.client.provider.ms-pagos.token-uri=http://localhost:9000/oauth2/token
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.auto-create=false
# el envio y la reconciliacion los llamo a mano
eventos.reintento-ms=3600000
pagos.reconciliacion-ms=3600000
