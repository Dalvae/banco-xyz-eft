# en los tests no hay config-server ni eureka, la config de resilience4j la copio de config-repo/application.yml
spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks
spring.mvc.problemdetails.enabled=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=4
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.ignore-exceptions=org.springframework.web.server.ResponseStatusException
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=100ms
resilience4j.retry.configs.default.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.retry.retry-aspect-order=2
