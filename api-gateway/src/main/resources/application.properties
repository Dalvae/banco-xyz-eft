spring.application.name=api-gateway
server.port=8443
# https con un certificado autofirmado (pkcs12). en docker lo genera el Dockerfile con keytool,
# corriendo local hay que generarlo antes con scripts/certificado.sh
server.ssl.enabled=true
server.ssl.key-store=${GATEWAY_KEYSTORE:file:../.runtime/gateway.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${GATEWAY_KEYSTORE_PASSWORD:changeit}
server.ssl.key-alias=gateway
# las rutas, eureka y el circuit breaker vienen del config-server: config-repo/api-gateway.yml
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_USER:config}
spring.cloud.config.password=${CONFIG_PASSWORD:}
