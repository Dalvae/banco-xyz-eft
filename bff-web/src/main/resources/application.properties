spring.application.name=bff-web
server.port=8441
# valida el token del auth-server: firma (jwks), issuer y que la audiencia sea este canal
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://auth-server:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_ISSUER:http://auth-server:9000}/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.audiences=bank-web
bank.client.base-url=${BANK_API_URL:http://localhost:8440}
spring.mvc.problemdetails.enabled=true

# circuit breaker y retry (vienen del modulo shared)
spring.config.import=classpath:resiliencia.properties
