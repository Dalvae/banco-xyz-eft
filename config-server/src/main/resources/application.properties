spring.application.name=config-server
server.port=8888
# perfil native: lee los yml de una carpeta en vez de un repo git. en docker la carpeta config-repo se copia a /config-repo
# (en aws se podria cambiar a un repo git o a s3 sin tocar los servicios)
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO:file:../config-repo}
# usuario y clave que usan los servicios para pedir su config
spring.security.user.name=${CONFIG_USER:config}
spring.security.user.password=${CONFIG_PASSWORD:config}
management.endpoints.web.exposure.include=health,info
