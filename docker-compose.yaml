# banco xyz eft, todo el sistema con un solo comando:
#   cp .env.example .env
#   docker-compose up -d --build
# y para tener 2 replicas de ms-cuentas: docker-compose up -d --scale ms-cuentas=2
# los jobs batch no parten solos, son one-shot: docker-compose run --rm batch --spring.batch.job.name=interesesJob
#
# adentro de la red banco-net todo va en http y por nombre. hacia afuera solo quedan:
#   8443 api-gateway (https), 8761 eureka, 8888 config-server, 8090 kafka-ui
#
# ojo con la ram: lo probe en colima con 8gb y 4 cpu. cada java va con heap de 200m y serial gc,
# y kafka quedo en 1 broker (en s8 eran 3 y con todo lo nuevo no cabia)

# lo mismo para todos los servicios java
x-java: &java
  restart: unless-stopped
  mem_limit: 450m
  networks: [banco-net]

x-java-env: &java-env
  JAVA_TOOL_OPTIONS: -Xmx200m -Xss512k -XX:MaxMetaspaceSize=150m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
  CONFIG_SERVER_URL: http://config-server:8888
  CONFIG_USER: config
  CONFIG_PASSWORD: ${CONFIG_PASSWORD}
  EUREKA_URL: http://eureka-server:8761/eureka
  AUTH_ISSUER: http://auth-server:9000
  AUTH_URL: http://auth-server:9000
  MYSQL_HOST: mysql
  DB_PASSWORD: ${DB_PASSWORD}
  KAFKA_BOOTSTRAP: kafka:9092

# los microservicios esperan a que esten la config, eureka, el auth-server y la bd
x-depende-base: &depende-base
  config-server:
    condition: service_healthy
  eureka-server:
    condition: service_healthy
  auth-server:
    condition: service_healthy
  mysql:
    condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    mem_limit: 600m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
    # menos buffer pool que el default para que no se coma la ram
    command: --innodb-buffer-pool-size=64M --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      retries: 15
    networks: [banco-net]

  # 1 broker kraft (broker y controller a la vez). en s8 tenia 3 con replication factor 3, pero con los
  # 12 servicios java no alcanzaba la ram de colima. en aws va msk con 3 brokers (ver despliegue.md)
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped
    mem_limit: 700m
    ports: ["19092:19092"]
    environment:
      CLUSTER_ID: VHUHqvYNTAynpbtuiuPPcg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      interval: 10s
      retries: 10
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [banco-net]

  # http://localhost:8090 para ver topicos, mensajes y consumidores
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    mem_limit: 400m
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: banco-xyz
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: -Xmx200m
    depends_on:
      kafka:
        condition: service_healthy
    networks: [banco-net]

  # spring cloud config (perfil native). la carpeta config-repo se monta para poder cambiar un yml sin reconstruir
  config-server:
    <<: *java
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: banco-xyz/config-server
    container_name: config-server
    ports: ["8888:8888"]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx128m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1
      CONFIG_USER: config
      CONFIG_PASSWORD: ${CONFIG_PASSWORD}
      CONFIG_REPO: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: wget -qO- http://localhost:8888/actuator/health | grep -q UP
      interval: 10s
      retries: 12

  # http://localhost:8761 se ven las instancias registradas
  eureka-server:
    <<: *java
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    image: banco-xyz/eureka-server
    container_name: eureka-server
    ports: ["8761:8761"]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx150m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    healthcheck:
      test: wget -qO- http://localhost:8761/actuator/health | grep -q UP
      interval: 10s
      retries: 12

  auth-server:
    <<: *java
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    image: banco-xyz/auth-server
    container_name: auth-server
    # sin ports: se llega por el gateway (https://localhost:8443/oauth2/...)
    environment:
      JAVA_TOOL_OPTIONS: -Xmx150m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      OPS_CLIENT_SECRET: ${OPS_CLIENT_SECRET}
      PAGOS_CLIENT_SECRET: ${PAGOS_CLIENT_SECRET}
    healthcheck:
      test: wget -qO- http://localhost:9000/actuator/health | grep -q UP
      interval: 10s
      retries: 12

  # los 3 microservicios no tienen container_name ni ports, asi se pueden escalar (--scale ms-cuentas=2).
  # se registran en eureka y los demas los llaman por nombre (lb://ms-cuentas)
  ms-cuentas:
    <<: *java
    build:
      context: .
      dockerfile: ms-cuentas/Dockerfile
    image: banco-xyz/ms-cuentas
    environment:
      <<: *java-env
    depends_on:
      <<: *depende-base
      ms-clientes:
        condition: service_healthy
    healthcheck:
      test: wget -qO- http://localhost:8081/actuator/health | grep -q UP
      interval: 10s
      retries: 15

  ms-pagos:
    <<: *java
    build:
      context: .
      dockerfile: ms-pagos/Dockerfile
    image: banco-xyz/ms-pagos
    environment:
      <<: *java-env
      PAGOS_CLIENT_SECRET: ${PAGOS_CLIENT_SECRET}
    depends_on:
      <<: *depende-base
      kafka:
        condition: service_healthy
    healthcheck:
      test: wget -qO- http://localhost:8082/actuator/health | grep -q UP
      interval: 10s
      retries: 15

  ms-clientes:
    <<: *java
    build:
      context: .
      dockerfile: ms-clientes/Dockerfile
    image: banco-xyz/ms-clientes
    environment:
      <<: *java-env
    depends_on:
      <<: *depende-base
    healthcheck:
      test: wget -qO- http://localhost:8083/actuator/health | grep -q UP
      interval: 10s
      retries: 15

  # un bff por canal. tampoco tienen ports, se entra por el gateway
  bff-web:
    <<: *java
    build:
      context: .
      dockerfile: bff-web/Dockerfile
    image: banco-xyz/bff-web
    environment:
      <<: *java-env
    depends_on:
      <<: *depende-base
    healthcheck:
      test: wget -qO- http://localhost:8441/actuator/health | grep -q UP
      interval: 10s
      retries: 15

  bff-mobile:
    <<: *java
    build:
      context: .
      dockerfile: bff-mobile/Dockerfile
    image: banco-xyz/bff-mobile
    environment:
      <<: *java-env
    depends_on:
      <<: *depende-base
    healthcheck:
      test: wget -qO- http://localhost:8442/actuator/health | grep -q UP
      interval: 10s
      retries: 15

  bff-atm:
    <<: *java
    build:
      context: .
      dockerfile: bff-atm/Dockerfile
    image: banco-xyz/bff-atm
    environment:
      <<: *java-env
    depends_on:
      <<: *depende-base
    healthcheck:
      test: wget -qO- http://localhost:8444/actuator/health | grep -q UP
      interval: 10s
      retries: 15

  notificaciones:
    <<: *java
    build:
      context: .
      dockerfile: notificaciones/Dockerfile
    image: banco-xyz/notificaciones
    environment:
      <<: *java-env
    depends_on:
      <<: *depende-base
      kafka:
        condition: service_healthy
    healthcheck:
      test: wget -qO- http://localhost:8450/actuator/health | grep -q UP
      interval: 10s
      retries: 15

  # la unica puerta de entrada: https://localhost:8443 (certificado autofirmado, con curl usar -k)
  api-gateway:
    <<: *java
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
      args:
        GATEWAY_KEYSTORE_PASSWORD: ${GATEWAY_KEYSTORE_PASSWORD}
    image: banco-xyz/api-gateway
    container_name: api-gateway
    ports: ["8443:8443"]
    environment:
      <<: *java-env
      GATEWAY_KEYSTORE_PASSWORD: ${GATEWAY_KEYSTORE_PASSWORD}
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      # es https y el wget de alpine no trae tls, asi que solo reviso que el puerto este escuchando
      test: nc -z localhost 8443
      interval: 10s
      retries: 15

  # spring batch, one-shot: corre un job y el contenedor termina. no parte con el up normal (profile batch)
  #   docker-compose run --rm batch                                       (transaccionesJob)
  #   docker-compose run --rm batch --spring.batch.job.name=interesesJob
  #   docker-compose run --rm batch --spring.batch.job.name=estadoCuentaJob
  # si un step falla el mismo proceso lo reejecuta (ReejecucionRunner) y si el contenedor muere,
  # con el restart on-failure vuelve a partir y retoma la ejecucion que quedo FAILED
  batch:
    build:
      context: .
      dockerfile: batch/Dockerfile
    image: banco-xyz/batch
    profiles: [batch]
    restart: on-failure:3
    mem_limit: 450m
    environment:
      JAVA_TOOL_OPTIONS: -Xmx200m -XX:+UseSerialGC
      MYSQL_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      BATCH_JOB: transaccionesJob
    volumes:
      - batch-reportes:/app/reportes
    depends_on:
      mysql:
        condition: service_healthy
    networks: [banco-net]

networks:
  banco-net:

volumes:
  mysql-data:
  kafka-data:
  batch-reportes:
