# banco xyz semana 8, todo el sistema con un solo comando:
#   cp .env.example .env
#   docker-compose up -d --build
# adentro de la red banco-net los servicios se hablan por nombre y en http

# cluster kafka de 3 brokers en modo kraft (sin zookeeper). los 3 son broker y controller a la vez
# cada uno publica 2 listeners: PLAINTEXT para los contenedores (kafka-N:9092) y EXTERNAL para
# correr los microservicios desde el ide en el mac (localhost:19092, 29092 y 39092)
x-kafka-comun: &kafka-comun
  CLUSTER_ID: VHUHqvYNTAynpbtuiuPPcg   # sale de kafka-storage.sh random-uuid, tiene que ser el mismo en los 3
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  # todo con 3 copias, y para escribir tienen que estar al menos 2 al dia (asi aguanta que se caiga 1)
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_NUM_PARTITIONS: 3
  # que no se coma toda la ram, son 3
  KAFKA_HEAP_OPTS: -Xmx512m -Xms512m

services:
  kafka-1:
    image: apache/kafka:3.9.1
    container_name: kafka-1
    restart: unless-stopped
    ports: ["19092:19092"]
    environment:
      <<: *kafka-comun
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      interval: 10s
      retries: 10
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks: [banco-net]

  kafka-2:
    image: apache/kafka:3.9.1
    container_name: kafka-2
    restart: unless-stopped
    ports: ["29092:29092"]
    environment:
      <<: *kafka-comun
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      interval: 10s
      retries: 10
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks: [banco-net]

  kafka-3:
    image: apache/kafka:3.9.1
    container_name: kafka-3
    restart: unless-stopped
    ports: ["39092:39092"]
    environment:
      <<: *kafka-comun
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:39092
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:39092
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      interval: 10s
      retries: 10
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    networks: [banco-net]

  # pagina web para ver el cluster: brokers, topicos, particiones y consumidores (igual que en la clase)
  # http://localhost:8090
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: banco-xyz
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks: [banco-net]

  auth-server:
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    image: banco-xyz/auth-server
    container_name: auth-server
    restart: unless-stopped
    ports: ["9000:9000"]
    environment:
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      OPS_CLIENT_SECRET: ${OPS_CLIENT_SECRET}
    healthcheck:
      test: wget -qO- http://localhost:9000/actuator/health | grep -q UP
      interval: 10s
      retries: 10
    networks: [banco-net]

  bank-api:
    build:
      context: .
      dockerfile: bank-api/Dockerfile
    image: banco-xyz/bank-api
    container_name: bank-api
    restart: unless-stopped
    # sin ports: a bank-api solo se llega desde los bff por la red interna
    environment:
      BANK_DB_URL: jdbc:h2:file:/app/data/bank
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
    volumes:
      - bank-data:/app/data
    healthcheck:
      test: wget -qO- http://localhost:8440/actuator/health | grep -q UP
      interval: 10s
      retries: 10
    depends_on:
      auth-server:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks: [banco-net]

  bff-web:
    build:
      context: .
      dockerfile: bff-web/Dockerfile
    image: banco-xyz/bff-web
    container_name: bff-web
    restart: unless-stopped
    ports: ["8441:8441"]
    environment:
      BANK_API_URL: http://bank-api:8440
    depends_on:
      bank-api:
        condition: service_healthy
    networks: [banco-net]

  bff-mobile:
    build:
      context: .
      dockerfile: bff-mobile/Dockerfile
    image: banco-xyz/bff-mobile
    container_name: bff-mobile
    restart: unless-stopped
    ports: ["8442:8442"]
    environment:
      BANK_API_URL: http://bank-api:8440
    depends_on:
      bank-api:
        condition: service_healthy
    networks: [banco-net]

  bff-atm:
    build:
      context: .
      dockerfile: bff-atm/Dockerfile
    image: banco-xyz/bff-atm
    container_name: bff-atm
    restart: unless-stopped
    ports: ["8443:8443"]
    environment:
      BANK_API_URL: http://bank-api:8440
    depends_on:
      bank-api:
        condition: service_healthy
    networks: [banco-net]

  notificaciones:
    build:
      context: .
      dockerfile: notificaciones/Dockerfile
    image: banco-xyz/notificaciones
    container_name: notificaciones
    restart: unless-stopped
    ports: ["8450:8450"]
    environment:
      NOTIF_DB_URL: jdbc:h2:file:/app/data/notificaciones
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
    volumes:
      - notif-data:/app/data
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks: [banco-net]

networks:
  banco-net:

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  bank-data:
  notif-data:
