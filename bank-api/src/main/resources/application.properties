spring.application.name=bank-api
server.port=8440
spring.datasource.url=${BANK_DB_URL:jdbc:h2:file:./.runtime/bank}
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=true
# los tokens los emite el auth-server, aca solo se validan (firma con el jwks, issuer y audiencia)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://auth-server:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_ISSUER:http://auth-server:9000}/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.audiences=bank-web,bank-mobile,bank-atm
# kafka (productor)
# en docker viene KAFKA_BOOTSTRAP con los 3 brokers, corriendo local se usan los puertos externos
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:19092,localhost:29092,localhost:39092}
# el resto de la config del productor esta en eventos/KafkaProducerConfig
management.endpoints.web.exposure.include=health
server.error.include-message=never
