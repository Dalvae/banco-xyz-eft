# config de resilience4j que usan los 3 bff, la saque aca para no tenerla copiada 3 veces
# resilience4j (circuit breaker + retry), la instancia bankApi es la que usan los services
# si falla la mitad de las ultimas 10 llamadas (minimo 4) se abre el circuito por 15s
resilience4j.circuitbreaker.instances.bankApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.bankApi.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.bankApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bankApi.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.bankApi.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.bankApi.automatic-transition-from-open-to-half-open-enabled=true
# los 4xx no son culpa de bank-api, no cuentan como falla
resilience4j.circuitbreaker.instances.bankApi.ignore-exceptions=org.springframework.web.server.ResponseStatusException
# 3 intentos con 500ms entre cada uno, solo si bank-api no responde o tira 5xx
resilience4j.retry.instances.bankApi.max-attempts=3
resilience4j.retry.instances.bankApi.wait-duration=500ms
resilience4j.retry.instances.bankApi.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
# circuit breaker afuera y retry adentro. por defecto es al reves y el fallback del CB
# se comia el error antes de que el retry alcanzara a reintentar (esto me costo cachar)
resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.retry.retry-aspect-order=2

management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
