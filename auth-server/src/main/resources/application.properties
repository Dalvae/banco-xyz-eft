spring.application.name=auth-server
server.port=9000
# el issuer va fijo, asi el token dice lo mismo si lo pido desde localhost o desde la red de docker
bank.auth.issuer=${AUTH_ISSUER:http://auth-server:9000}
bank.auth.demo-password=${DEMO_PASSWORD}
bank.auth.ops-secret=${OPS_CLIENT_SECRET}
bank.auth.redirect-uri=http://127.0.0.1:8080/callback
management.endpoints.web.exposure.include=health
