spring.application.name=notificaciones
server.port=8450
spring.datasource.url=${NOTIF_DB_URL:jdbc:h2:file:./.runtime/notificaciones}
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://auth-server:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_ISSUER:http://auth-server:9000}/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.audiences=ops-notificaciones
# kafka (consumidor)
# en docker viene KAFKA_BOOTSTRAP con los 3 brokers, corriendo local se usan los puertos externos
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:19092,localhost:29092,localhost:39092}
# el resto de la config del consumidor esta en KafkaConsumerConfig
management.endpoints.web.exposure.include=health
