---
# crea key pair, security group y la ec2 donde va solo kafka. corre en mi compu (localhost)
- name: provisionar ec2 para banco xyz
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/aws:
      region: "{{ aws_region }}"
  tasks:
    - name: revisar que me pasaron mi_ip
      ansible.builtin.assert:
        that: mi_ip | length > 0
        fail_msg: "pasa tu ip con -e mi_ip=x.x.x.x/32 (para no abrir kafka al mundo)"

    - name: key pair (solo si no uso uno existente como vockey)
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
      register: key
      when: crear_key | bool

    - name: guardar la llave privada (solo sale la primera vez que se crea)
      ansible.builtin.copy:
        content: "{{ key.key.private_key }}"
        dest: "{{ key_file }}"
        mode: "0600"
      when: crear_key | bool and key.key.private_key is defined

    - name: vpc por defecto
      amazon.aws.ec2_vpc_net_info:
        filters:
          is-default: "true"
      register: vpcs

    - name: security group
      amazon.aws.ec2_security_group:
        name: "{{ sg_name }}"
        description: banco xyz eft
        vpc_id: "{{ vpcs.vpcs[0].vpc_id }}"
        rules:
          - proto: tcp
            ports: 22
            cidr_ip: "{{ mi_ip }}"
          - proto: tcp
            ports: "{{ kafka_externo_port }}"
            cidr_ip: "{{ mi_ip }}"
          - proto: tcp
            ports: "{{ kafka_ui_port }}"
            cidr_ip: "{{ mi_ip }}"
        tags:
          Project: "{{ project_name }}"
      register: sg

    - name: buscar ami de al2023
      ansible.builtin.set_fact:
        ami_id: "{{ lookup('amazon.aws.ssm_parameter', ami_ssm_param, region=aws_region) }}"

    - name: instancia ec2
      amazon.aws.ec2_instance:
        name: "{{ project_name }}"
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        security_group: "{{ sg.group_id }}"
        iam_instance_profile: "{{ instance_profile | default(omit, true) }}"
        network:
          assign_public_ip: true
        volumes:
          - device_name: /dev/xvda
            ebs:
              volume_size: "{{ volume_size_gb }}"
              volume_type: gp3
              delete_on_termination: true
        tags:
          Project: "{{ project_name }}"
        state: running
        wait: true
      register: ec2

    - name: agregar el host al inventario en memoria
      ansible.builtin.add_host:
        name: "{{ ec2.instances[0].public_ip_address }}"
        groups: banco
        ansible_user: "{{ ssh_user }}"
        ansible_ssh_private_key_file: "{{ key_file }}"

    - name: escribir inventory.ini para deploy.yml
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/inventory.ini"
        content: |
          [banco]
          {{ ec2.instances[0].public_ip_address }} ansible_user={{ ssh_user }} ansible_ssh_private_key_file={{ key_file }}
        mode: "0644"

    - name: esperar a que abra el ssh
      ansible.builtin.wait_for:
        host: "{{ ec2.instances[0].public_ip_address }}"
        port: 22
        delay: 10
        timeout: 300

    - name: listo
      ansible.builtin.debug:
        msg: "ec2 arriba en {{ ec2.instances[0].public_ip_address }}, ahora corre deploy.yml (sin ALB ni nada, solo la ec2)"
