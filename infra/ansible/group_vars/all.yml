# variables comunes de los 3 playbooks
aws_region: us-east-1
instance_type: t3.medium     # solo kafka + kafka-ui, con 4 GB sobra
volume_size_gb: 20
project_name: banco-xyz-eft
# key pair: por defecto creo uno propio. en learner lab se puede usar el que ya existe:
#   -e key_name=vockey -e crear_key=false -e key_file=~/.ssh/labsuser.pem
crear_key: true
key_name: "{{ project_name }}-key"
key_file: "~/.ssh/{{ key_name }}.pem"
sg_name: "{{ project_name }}-sg"

# perfil de instancia opcional (no creo roles iam). en learner lab: -e instance_profile=LabInstanceProfile
instance_profile: ""

# ami de amazon linux 2023 (se busca en ssm, asi no hay que hardcodear el id)
ami_ssm_param: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
ssh_user: ec2-user

# mi_ip se pasa por -e (ej: -e mi_ip=1.2.3.4/32), no la dejo fija en el repo
mi_ip: ""

# puertos de kafka en la ec2
kafka_externo_port: 9094     # el que usa mi docker compose local (KAFKA_BOOTSTRAP)
kafka_ui_port: 8090
kafka_dir: /opt/kafka-banco

# topicos reales, los mismos que crea ms-pagos (KafkaProducerConfig)
topicos:
  - { nombre: banco.transacciones, particiones: 3 }
  - { nombre: banco.alertas-seguridad, particiones: 1 }
