spring.application.name=batch
# Configuración de base de datos (MySQL)
# rewriteBatchedStatements colapsa el batch del writer en un solo INSERT multi-fila (1407 -> 404
# sentencias por corrida); el resto evita round trips de configuración por conexión (medido en la sumativa 1).
# en la eft usa el mismo mysql del docker-compose, con su propio schema y usuario (batch)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/banco_xyz_batch?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cacheServerConfiguration=true&useLocalSessionState=true&cachePrepStmts=true
spring.datasource.username=batch
spring.datasource.password=${DB_PASSWORD:banco}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Cada partición ocupa una conexión mientras dura su transacción; el default de Hikari (10)
# quedaría corto en una máquina con muchos núcleos, donde el grid es mayor.
spring.datasource.hikari.maximum-pool-size=20

# Configuración de Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always
# el job no lo lanza spring boot sino ReejecucionRunner, que ademas lo reintenta si falla un step (ver esa clase)
spring.batch.job.enabled=false
# que job corre: --spring.batch.job.name=transaccionesJob | interesesJob | estadoCuentaJob
spring.batch.job.name=${BATCH_JOB:transaccionesJob}
# reejecucion automatica ante fallo critico: cuantas veces y cuanto espera entre cada una (va creciendo)
batch.reejecucion.max-intentos=3
batch.reejecucion.espera-ms=2000

# los csv de fin_legacy_data (https://github.com/KariVillagran/fin_legacy_data) estan en batch/data/semana_N.
# en docker la carpeta queda en /app/data. para procesar otra semana: --batch.semana=semana_1
batch.semana=semana_3
batch.data-dir=${BATCH_DATA_DIR:data}
ruta.archivo.transacciones=file:${batch.data-dir}/${batch.semana}/movimientos_financieros_diarios.csv
ruta.archivo.intereses=file:${batch.data-dir}/${batch.semana}/intereses_trimestrales.csv
ruta.archivo.estadoCuenta=file:${batch.data-dir}/${batch.semana}/estados_financieros_anuales.csv

# Escalado: batch.partition.grid-size, batch.partition.pool-size y batch.chunk-size. Sin valor aquí
# toman los defaults medidos en la sumativa 1 (mitad de los núcleos, chunk 100).

# Identifica el CSV lógico de movimientos anuales. Cambie este valor antes de procesar otro CSV.
batch.dataset-id=${batch.semana}
# Identifica independientemente el CSV de intereses; no se relaciona con otros datasets.
batch.intereses.dataset-id=${batch.semana}-intereses
# Por defecto los reportes se guardan fuera del repositorio, en el directorio temporal del sistema.
batch.reports.output-directory=${BATCH_REPORTES:${java.io.tmpdir}/banco-xyz-batch-reportes}

# Umbral de omisión: si un job omite más de esta proporción del origen, queda FAILED.
# Detecta que el archivo se degradó respecto de lo conocido, no que venga sucio: estos CSV ya
# vienen sucios a propósito, así que cada techo está por encima del baseline medido de su job
# (transacciones 59,9 %, intereses 73,7 %, estados de cuenta 31,4 %). Recalibrar si cambia el origen.
batch.skip.max-ratio=0.80
# Por encima de esto pero bajo el umbral: no falla, pero deja un WARN. Una tasa esperada no es una
# tasa aceptable.
batch.skip.warn-ratio=0.25

# medido de nuevo con fin_legacy_data semana_3 (eft): transacciones 60,8 %, intereses 62,5 %, estados 39,6 %.
# los 3 quedan bajo su umbral, asi que los deje igual
batch.skip.max-ratio.transaccionesJob=0.70
batch.skip.max-ratio.interesesJob=0.85
batch.skip.max-ratio.estadoCuentaJob=0.45
