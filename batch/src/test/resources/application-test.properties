# sin mysql: h2 en modo mysql (el schema.sql usa ON DUPLICATE KEY e INDEX dentro del CREATE TABLE y h2 lo aguanta asi)
spring.datasource.url=jdbc:h2:mem:batch-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
batch.reejecucion.espera-ms=10
batch.reports.output-directory=target/reportes
